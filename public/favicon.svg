<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background Drop Shadow -->
  <rect x="25" y="15" width="50" height="70" rx="6" fill="#E2E8F0" />
  
  <!-- Back Document -->
  <rect x="20" y="10" width="50" height="70" rx="6" fill="#94A3B8" />
  
  <!-- Front Document -->
  <rect x="15" y="20" width="55" height="70" rx="6" fill="#3B82F6" />
  
  <!-- Lines on Document -->
  <line x1="25" y1="35" x2="60" y2="35" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <line x1="25" y1="48" x2="60" y2="48" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <line x1="25" y1="61" x2="45" y2="61" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  
  <!-- Magnifying Glass -->
  <circle cx="65" cy="65" r="18" fill="none" stroke="#F59E0B" stroke-width="8" />
  <line x1="77" y1="77" x2="92" y2="92" stroke="#F59E0B" stroke-width="10" stroke-linecap="round" />
  
  <!-- Glass reflection -->
  <path d="M55 55 Q 65 50 75 60" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6" />
</svg>